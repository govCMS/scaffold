##
# GovCMS scaffold. Intentionally identical across all projects of a given type
# (saas | paas | saasplus) — every per-project value comes from .env. Do not
# edit this file directly; add local overrides to docker-compose.override.yml
# and append it to COMPOSE_FILE in .env once created.
#
# Optional services (test, chrome, solr, redis) are opt-in via the `include:`
# list below. The installer comments out entries a project does not use.
##

include:
  - path: .docker/compose/test.yml
    project_directory: .
    env_file: .env
  - path: .docker/compose/chrome.yml
    project_directory: .
    env_file: .env
  # Uncomment to enable solr.
  # - path: .docker/compose/solr.yml
  #   project_directory: .
  #   env_file: .env
  # Uncomment to enable redis.
  # - path: .docker/compose/redis.yml
  #   project_directory: .
  #   env_file: .env

services:
  cli:
    extends:
      file: .docker/compose/_common.${GOVCMS_VOLUMES:-default}.yml
      service: govcms-app
    build:
      context: .
      dockerfile: .docker/Dockerfile.cli
      args:
        LAGOON_SAFE_PROJECT: ${GOVCMS_PROJECT_NAME}
        GOVCMS_IMAGE_VERSION: ${GOVCMS_IMAGE_VERSION:-${GOVCMS_VERSION}.x-latest}
        GOVCMS_GITHUB_TOKEN: ${GOVCMS_GITHUB_TOKEN:-}
    image: ${GOVCMS_PROJECT_NAME}
    container_name: ${GOVCMS_PROJECT_NAME}
    labels:
      lagoon.type: cli-persistent
      lagoon.persistent.name: nginx
      lagoon.persistent: /app/web/sites/default/files/
      lagoon.base.image: govcms/govcms:${GOVCMS_IMAGE_VERSION:-${GOVCMS_VERSION}.x-latest}
    depends_on:
      mariadb:
        condition: service_healthy

  nginx:
    extends:
      file: .docker/compose/_common.${GOVCMS_VOLUMES:-default}.yml
      service: govcms-app
    build:
      context: .
      dockerfile: .docker/Dockerfile.nginx-drupal
      args:
        CLI_IMAGE: ${GOVCMS_PROJECT_NAME}
        GOVCMS_IMAGE_VERSION: ${GOVCMS_IMAGE_VERSION:-${GOVCMS_VERSION}.x-latest}
      additional_contexts:
        cli: 'service:cli' # Ensure cli is built first
    labels:
      lagoon.type: nginx-php-persistent
      lagoon.persistent: /app/web/sites/default/files/
      lagoon.base.image: govcms/nginx-drupal:${GOVCMS_IMAGE_VERSION:-${GOVCMS_VERSION}.x-latest}
    environment:
      LAGOON_LOCALDEV_URL: ${LOCALDEV_URL:-http://${GOVCMS_PROJECT_NAME}.docker.amazee.io}
    depends_on:
      - cli
    networks:
      - amazeeio-network
      - default

  php:
    extends:
      file: .docker/compose/_common.${GOVCMS_VOLUMES:-default}.yml
      service: govcms-app
    build:
      context: .
      dockerfile: .docker/Dockerfile.php
      args:
        CLI_IMAGE: ${GOVCMS_PROJECT_NAME}
        GOVCMS_IMAGE_VERSION: ${GOVCMS_IMAGE_VERSION:-${GOVCMS_VERSION}.x-latest}
      additional_contexts:
        cli: 'service:cli'
    labels:
      lagoon.type: nginx-php-persistent
      lagoon.name: nginx
      lagoon.persistent: /app/web/sites/default/files/
      lagoon.base.image: govcms/php:${GOVCMS_IMAGE_VERSION:-${GOVCMS_VERSION}.x-latest}
    depends_on:
      - cli

  mariadb:
    image: ${MARIADB_DATA_IMAGE:-govcms/mariadb-drupal:${GOVCMS_VERSION}.x-latest}
    platform: linux/amd64
    labels:
      lagoon.type: mariadb
      lagoon.image: govcms/mariadb-drupal:${GOVCMS_VERSION}.x-latest
    ports:
      - "3306" # Find port on host with `docker compose port mariadb 3306`
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 24 # ~2m, matching the old dockerize -timeout 2m
      start_period: 10s
    environment:
      LAGOON_ENVIRONMENT_TYPE: ${LAGOON_ENVIRONMENT_TYPE:-}
      LAGOON_PROJECT: ${GOVCMS_PROJECT_NAME}
      LAGOON_ROUTE: ${LOCALDEV_URL:-http://${GOVCMS_PROJECT_NAME}.docker.amazee.io}
      GOVCMS_IMAGE_VERSION: ${GOVCMS_IMAGE_VERSION:-${GOVCMS_VERSION}.x-latest}
      DOCKERHOST: ${DOCKERHOST:-host.docker.internal}

  av:
    image: govcms/av:latest
    labels:
      lagoon.type: none

networks:
  amazeeio-network:
    external: true
