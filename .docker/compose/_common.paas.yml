##
# PaaS variant of _common.default.yml — same environment, single bind mount
# instead of the SaaS/SaaS+ volume list. Selected via GOVCMS_VOLUMES=paas
# in .env (set by scripts/scaffold-init.sh for `-t paas`).
#
# NOTE: CI neutralises the bind mount below to `[]` after `ahoy init` runs,
# for both the saas and paas matrix legs. See .github/workflows/test-scaffold.yml.
##

services:
  govcms-app:
    environment:
      RESTY_RESOLVER: 8.8.8.8
      STAGE_FILE_PROXY_URL: ${STAGE_FILE_PROXY_URL:-}
      LAGOON_ENVIRONMENT_TYPE: ${LAGOON_ENVIRONMENT_TYPE:-}
      LAGOON_PROJECT: ${GOVCMS_PROJECT_NAME}
      LAGOON_ROUTE: ${LOCALDEV_URL:-http://${GOVCMS_PROJECT_NAME}.docker.amazee.io}
      GOVCMS_IMAGE_VERSION: ${GOVCMS_IMAGE_VERSION:-${GOVCMS_VERSION}.x-latest}
      DEV_MODE: "${DEV_MODE:-false}"
      XDEBUG_ENABLE: ${XDEBUG_ENABLE:-}
      DOCKERHOST: ${DOCKERHOST:-host.docker.internal}
      X_FRAME_OPTIONS: ${X_FRAME_OPTIONS:-SameOrigin}
      DRUPAL_SHIELD_USER: ${DRUPAL_SHIELD_USER:-}
      DRUPAL_SHIELD_PASS: ${DRUPAL_SHIELD_PASS:-}
      GOVCMS_DEPLOY_WORKFLOW_CONFIG: ${GOVCMS_DEPLOY_WORKFLOW_CONFIG:-import}
      GOVCMS_PREPARE_XML_SCRIPT: /app/vendor/bin/govcms-prepare-xml
      HTTPAV_ENDPOINT: http://av:3993/scan
      HTTPAV_RETURN_KEY: comodo
      HTTP_PAYLOAD_KEY: malware
      SOLR_MODULES: ${SOLR_MODULES:-extraction,langid,ltr,analysis-extras}
    volumes:
      # NOTE: extends has no project_directory equivalent — this path
      # resolves against this file's own directory, not the project root.
      - ../../:/app:delegated
