##
# Opt-in Solr search backend. Commented out of the root docker-compose.yml by
# default (matching today's commented-out solr: block) — uncomment the
# include entry to enable it for a project.
##

services:
  solr:
    build:
      context: .
      dockerfile: .docker/Dockerfile.solr
      args:
        GOVCMS_IMAGE_VERSION: ${GOVCMS_IMAGE_VERSION:-${GOVCMS_VERSION}.x-latest}
        LAGOON_IMAGE_VERSION: ${LAGOON_IMAGE_VERSION:-latest}
    labels:
      lagoon.type: solr
      lagoon.base.image: govcms/solr:${GOVCMS_IMAGE_VERSION:-${GOVCMS_VERSION}.x-latest}
    ports:
      - "8983" # Find port on host with `docker compose port solr 8983`
    depends_on:
      - cli
    environment:
      LAGOON_ENVIRONMENT_TYPE: ${LAGOON_ENVIRONMENT_TYPE:-}
      LAGOON_PROJECT: ${GOVCMS_PROJECT_NAME}
      GOVCMS_IMAGE_VERSION: ${GOVCMS_IMAGE_VERSION:-${GOVCMS_VERSION}.x-latest}
      DOCKERHOST: ${DOCKERHOST:-host.docker.internal}
      SOLR_MODULES: ${SOLR_MODULES:-extraction,langid,ltr,analysis-extras}
